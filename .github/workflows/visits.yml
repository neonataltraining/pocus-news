name: Visitor summary
on:
  schedule:
    - cron: "17 */6 * * *"   # collect visits every 6 hours
    - cron: "0 7 * * 1"      # weekly summary, Monday 08:00/09:00 Swedish time
  workflow_dispatch:
    inputs:
      summary:
        description: "Send the summary now"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/visits.py collect
      - if: github.event.schedule == '0 7 * * 1' || inputs.summary
        run: python3 scripts/visits.py summary
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/visits.jsonl data/last-summary.txt 2>/dev/null || git add data/visits.jsonl
          git diff --cached --quiet || (git commit -m "Update visit log" && git pull --rebase -q && git push)
