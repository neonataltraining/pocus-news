name: Commee user agreement reminder
on:
  schedule:
    - cron: "0 7 2 11 *"   # Monday 2 November, 08:00 Swedish time
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.run_started_at, '2026')
        run: python3 scripts/commee_agreement_reminder.py
