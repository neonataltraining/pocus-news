name: Commee early-bird reminder
on:
  schedule:
    - cron: "0 7 25 2 *"   # 25 February 08:00 Swedish time
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.run_started_at, '2027')
        run: python3 scripts/commee_reminder.py
