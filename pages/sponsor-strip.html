<!-- Sponsor strip – POCUS 2027. Paste into ONE "Embed code" element (full width) near the bottom of the FRONT page.
     Logos come from sponsors.json on GitHub, so it updates by itself when a sponsor is added. -->
<style>
.ss27{font-family:Calibri,"Segoe UI",Arial,sans-serif;background:#F3F8F8;border-top:1px solid #C9DEDD;border-bottom:1px solid #C9DEDD;padding:26px 16px 22px;text-align:center}
.ss27 *{box-sizing:border-box}
.ss27 .h{margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#2F7D7A}
.ss27 .row{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 18px}
.ss27 .lg{display:flex;align-items:center;justify-content:center;width:170px;height:78px;background:#fff;border:1px solid #C9DEDD;border-radius:8px;padding:12px 16px;text-decoration:none}
.ss27 a.lg:hover{box-shadow:0 4px 12px rgba(16,42,67,.12)}
.ss27 .lg img{max-width:100%;max-height:52px;object-fit:contain}
.ss27 .lg span{font-weight:700;color:#102A43;font-size:16px}
.ss27 .more{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;color:#2F7D7A;text-decoration:none}
.ss27 .more:hover{text-decoration:underline}
@media(max-width:480px){.ss27 .lg{width:140px;height:66px}}
</style>
<div class="ss27" id="ss27" style="display:none">
 <p class="h">Supported by</p>
 <div class="row" id="ss27row"></div>
 <a class="more" href="https://neonataltraining.org/our-sponsors" target="_top">Meet our sponsors →</a>
</div>
<script>
(function(){
 var wrap=document.getElementById('ss27'),row=document.getElementById('ss27row');
 function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 fetch('https://raw.githubusercontent.com/neonataltraining/pocus-news/main/sponsors.json?t='+Date.now()).then(function(r){return r.json()}).then(function(list){
  if(!list.length)return;
  row.innerHTML=list.map(function(s){
   var inner=s.logo?'<img src="'+esc(s.logo)+'" alt="'+esc(s.name)+'" loading="lazy">':'<span>'+esc(s.name)+'</span>';
   var st=s.bg?' style="background:'+esc(s.bg)+'"':'';
   return s.url?'<a class="lg"'+st+' href="'+esc(s.url)+'" target="_blank" rel="noopener" title="'+esc(s.name)+'">'+inner+'</a>':'<div class="lg"'+st+' title="'+esc(s.name)+'">'+inner+'</div>';
  }).join('');
  wrap.style.display='';
 }).catch(function(){});
})();
</script>
